<style>
/* Yedi bölümlük 2D macera: sahne ortada; üstte bölüm çipi, altta heybe. */
:root{
  --frame:#140f0c; --wood:#3b2618; --wood-hi:#5a3b24; --paper:#f2e6c9; --ink:#24170f;
  --copper:#c97a3d; --gold:#e6bb5c; --teal:#2f6b6a; --plum:#3d2b4a; --mute:#bfa98a;
  --hand:'Amatic SC','Comic Sans MS',cursive; --body:'Nunito',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--frame);color:var(--paper);font-family:var(--body);overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#stageWrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#cv{display:block;border-radius:12px;box-shadow:0 14px 50px rgba(0,0,0,.6);cursor:pointer;background:#0b0912}
#top{position:absolute;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;z-index:6;pointer-events:none}
#chip{pointer-events:none;background:rgba(24,17,12,.82);border:1px solid #6a4f36;border-radius:14px;padding:7px 12px;font-size:12.5px;font-weight:800;color:#ffefc8;max-width:60%;line-height:1.3}
#chip small{display:block;font-weight:600;color:var(--mute);font-size:11.5px}
#chip .chapterNo{display:block;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;font-size:10px;margin-bottom:1px}
.btns{display:flex;gap:8px;pointer-events:auto}
#bSkip{pointer-events:auto;align-self:center;border:2px solid #6a4f36;border-radius:999px;background:rgba(24,17,12,.9);color:#ffefc8;font:800 13px var(--body);padding:8px 14px;cursor:pointer;box-shadow:0 5px 18px #0006}
#bSkip:hover{border-color:var(--gold)}
.ib{width:44px;height:44px;border-radius:50%;border:2px solid #6a4f36;background:rgba(24,17,12,.85);color:var(--paper);display:grid;place-items:center;cursor:pointer;padding:0;position:relative}
.ib svg{width:22px;height:22px}
.ib .badge{position:absolute;right:-3px;top:-3px;min-width:16px;height:16px;border-radius:8px;background:var(--copper);color:#1b120c;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 3px}
.ib:focus-visible,.btn:focus-visible,.slot:focus-visible,.choice:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#dlg{box-sizing:border-box;max-height:calc(100% - 16px);overflow-y:auto;overscroll-behavior:contain;position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:min(760px,calc(100% - 20px));z-index:7;display:flex;gap:12px;align-items:flex-start;
  background:linear-gradient(180deg,rgba(38,27,20,.96),rgba(26,18,13,.96));border:2px solid #7a5a3c;border-radius:16px 20px 14px 18px;padding:10px 14px 12px 10px;box-shadow:0 10px 30px rgba(0,0,0,.5);cursor:pointer}
#dlg canvas{flex:none;width:72px;height:72px;border-radius:12px;background:#22172a;border:1px solid #5c4433}
#dlg .tx{flex:1;min-width:0}
#dlg .nm{font-family:var(--hand);font-size:27px;line-height:1;color:var(--gold);margin:2px 0 4px}
#dlg .ln{font-size:15.5px;line-height:1.45;font-weight:700;min-height:2.9em}
#dlg .more{position:absolute;right:14px;bottom:8px;font-size:12px;color:var(--mute);animation:pulse 1.2s infinite}
#dlg .choices{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.choice{text-align:left;font:700 14.5px var(--body);color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:10px 14px 9px 12px;padding:7px 11px;cursor:pointer}
.choice:hover{background:#ffe9b8}
@keyframes pulse{50%{opacity:.35}}
#toast{position:absolute;left:50%;top:62px;transform:translateX(-50%);z-index:6;pointer-events:none;background:rgba(24,17,12,.9);border:1px solid #7a5a3c;color:#ffefc8;font-weight:800;font-size:14px;padding:7px 14px;border-radius:12px;opacity:0;transition:opacity .25s;max-width:86%;text-align:center}
#toast.on{opacity:1}
#turn{position:absolute;left:16px;right:16px;bottom:22%;text-align:center;font-size:13px;color:var(--mute);pointer-events:none}
#inv{flex:none;height:84px;display:flex;align-items:center;gap:8px;padding:0 12px;overflow-x:auto;background:linear-gradient(180deg,var(--wood-hi),var(--wood));border-top:3px solid #24170f;box-shadow:inset 0 3px 0 rgba(255,220,170,.08)}
#inv .lbl{font-family:var(--hand);font-size:24px;color:#e9cf9c;flex:none;margin-right:2px}
.slot{flex:none;width:64px;height:64px;border-radius:14px 18px 13px 16px;border:2px solid #24170f;background:radial-gradient(circle at 40% 35%,#6e4b2f,#4a2f1d);display:grid;place-items:center;cursor:pointer;padding:0;position:relative;touch-action:none}
.slot.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(230,187,92,.55);background:radial-gradient(circle at 40% 35%,#8a6038,#5a3a22)}
.slot.new{animation:pop .5s}
.slot canvas{width:56px;height:56px;pointer-events:none}
.slot.empty{opacity:.45;cursor:default}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
#drag{position:fixed;width:60px;height:60px;pointer-events:none;z-index:20;transform:translate(-50%,-50%) scale(1.1);filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
[hidden]{display:none!important}
#menu{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at center,rgba(20,14,10,.35),rgba(10,7,5,.82))}
.card{max-width:560px;width:100%;max-height:100%;overflow:auto;background:var(--paper);color:var(--ink);border-radius:20px 26px 18px 24px;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.6);border:3px solid var(--ink)}
.card .eyebrow{font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8a5a2e}
.card h1{font-family:var(--hand);font-size:clamp(38px,9vw,56px);line-height:.92;margin:4px 0 8px;color:#9c3b1f;text-wrap:balance}
.card p{margin:0 0 10px;line-height:1.45;font-size:14.5px}
.card .small{font-size:12.5px;color:#6a5640}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font-family:var(--hand);font-size:27px;line-height:1;border:3px solid var(--ink);border-radius:14px 18px 12px 16px;padding:6px 18px 8px;cursor:pointer;background:var(--gold);color:var(--ink)}
.btn.alt{background:#d9c7a3}
.btn.sm{font-size:21px;padding:4px 12px 6px}
.btn.danger{background:#e29587}
.btn:active{transform:translateY(2px)}
.slots-grid{display:flex;flex-direction:column;gap:8px;margin:10px 0 12px}
.save-slot{display:flex;gap:10px;align-items:center;background:#e8d9b8;border:2px solid var(--ink);border-radius:12px 16px 11px 14px;padding:8px 10px}
.save-slot canvas{width:84px;height:48px;border-radius:8px;border:1px solid #5c4433;background:#24170f;flex:none}
.save-slot .meta{flex:1;min-width:0;font-size:12.5px;line-height:1.35}
.save-slot .meta b{display:block;font-size:14px;color:#7a2e18}
.save-slot .acts{display:flex;flex-wrap:wrap;gap:5px}
.storage-note{font-size:11.5px;color:#5c4732;background:rgba(138,90,46,.1);border:1px dashed #8a5a2e;border-radius:8px;padding:6px 9px;margin:8px 0}
.stats{display:flex;gap:18px;margin:6px 0 14px;font-weight:800}
.stats b{display:block;font-family:var(--hand);font-size:34px;color:#9c3b1f;line-height:1}
@media (max-width:560px){#inv{height:72px}.slot{width:54px;height:54px}.slot canvas{width:46px;height:46px}#dlg{bottom:6px;padding:7px 11px 9px 8px;gap:9px;max-height:42%}#dlg .nm{font-size:22px;margin:0 0 2px}#dlg .ln{font-size:13.8px;line-height:1.35;min-height:0}#dlg canvas{width:52px;height:52px}#inv .lbl{display:none}}
@media (max-height:500px){

  #top{top:5px;left:8px;right:8px}#chip{padding:4px 9px;font-size:11.5px;max-width:56%}#chip small{font-size:10.5px}.ib{width:38px;height:38px}.ib svg{width:19px;height:19px}
  #dlg{bottom:5px;width:min(620px,calc(100% - 24px));max-height:36%;padding:6px 12px 7px 8px;gap:8px;border-radius:12px 15px 11px 14px}
  #dlg canvas{width:44px;height:44px;border-radius:9px}
  #dlg .nm{font-size:19px;margin:0 0 1px}
  #dlg .ln{font-size:13px;line-height:1.3;min-height:0}
  #dlg .more{right:10px;bottom:4px;font-size:11px}
  #dlg .choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:4px;margin-top:4px}
  .choice{padding:4px 8px;font-size:12.5px;line-height:1.22;border-radius:8px 11px 8px 10px}
}
#hearts{position:absolute;top:58px;left:12px;z-index:6;pointer-events:none;background:rgba(24,17,12,.82);border:1px solid #6a4f36;border-radius:12px;padding:4px 10px;font-weight:800;color:#ffefc8;font-size:13px;display:flex;gap:5px;align-items:center}
#hearts b{font-size:20px;line-height:1;color:#ff5a6e;text-shadow:0 0 6px rgba(255,80,100,.6)}#hearts b.off{color:#4a3a3a;text-shadow:none}
#hearts.hit{animation:hhit .5s}@keyframes hhit{0%,100%{transform:none}25%{transform:translateX(-6px) scale(1.12)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
#dlg .tbar{height:7px;border-radius:5px;background:#2a1e16;overflow:hidden;border:1px solid #5c4433}#dlg .tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#e6bb5c,#ffe39a)}#dlg .tbar.low i{background:linear-gradient(90deg,#c0392b,#ff6b4a)}
.duelin{display:flex;gap:6px}.duelin input{flex:1;min-width:0;font:700 16px Nunito,system-ui,sans-serif;padding:8px 10px;border-radius:10px;border:2px solid #8a6232;background:#fff7e6;color:#2a1a10}.duelin .choice{flex:none}
.badge.out{background:#5a4a40!important;color:#c9b8a8!important}
.card.lose h1{color:#d9a0a0}
#dlg.duel{left:8px;transform:none;width:min(560px,calc(58% - 8px))}
#dlg.kb{bottom:auto;max-height:calc(100% - 8px)}
@media (max-height:430px){#dlg.duel .choices{display:grid;grid-template-columns:1fr 1fr}#dlg.duel .tbar,#dlg.duel .duelin{grid-column:1/-1}#dlg.duel .choice{font-size:12.5px;line-height:1.25}}
@media (max-width:560px){#dlg.duel{left:50%;transform:translateX(-50%);width:calc(100% - 20px)}}
@media (prefers-reduced-motion:reduce){.slot.new,#dlg .more{animation:none}}

  c1_intro_1:'You woke before sunrise, Keloglan. All night you kept saying, “Seven gates, one tower...”',c1_intro_2:'A girl called to me from far away, mother. “The tower will not open until the secret of seven realms is solved,” she said.',c1_intro_3:'Not every dream deserves a chase, son. But when conscience calls, you do not turn your back.',c1_intro_4:'First light the hearth, fill the pot, and bring mint from the garden. Wrap your food for the road. Then we will say farewell.',c1_intro_5:'Do not worry, mother. I will take my wits; they carry more than any satchel.',
  c1_ana_ask:'What remains, mother?',c1_ana_dream:'Tell me about the dream.',c1_ana_love:'Leaving you alone troubles me.',c1_ana_status_start:'Look at the well. Our bucket is at the bottom; rope alone cannot grip it. There should be a hook in the yard.',c1_ana_status_water:'The pot is dry and the mint bed is thirsty. Once you recover the bucket, bring water to both.',c1_ana_status_fire:'Put dry wood in the hearth; the woven fan on the wall will wake the embers.',c1_ana_status_soup:'Water and fire are ready. Water the mint, pick fresh leaves, and add them to the pot.',c1_ana_status_food:'Combine bread and cheese, then wrap the food in the hanging cloth.',c1_ana_status_done:'The soup smells good and your bundle is ready. Come here; I have words for you.',
  c1_dream_story:'The voice was asking for help. She gave no name; when she said “Ali Cengiz,” the sky went dark.',c1_ana_dream_reply:'Even his name casts a shadow. His power is magic; yours is reason. Ask why before believing what you see.',c1_love_reply:'Leaving the nest is not abandonment. If you carry home in your heart, the road does not diminish you.',
  c1_ip:'Strong rope. It needs a hook to reach the bucket.',c1_kanca:'Rusty but strong. Tied to the rope, it could reach the well.',c1_kancali:'The knot holds. Now I can catch the bucket.',c1_bucket_up:'Caught it! The rope is worn, but the bucket is sound.',c1_bucket_fill:'The bucket is full of icy well water.',c1_well_empty:'The bucket is down there. I need something long with a hook.',c1_well_done:'The well water is cold as dawn.',c1_odun:'Sun-dried wood for the hearth.',c1_yelpaze:'Mother’s woven fan—perfect for waking embers.',c1_hearth_wood:'The wood is set. The embers need air.',c1_hearth_lit:'There! The hearth speaks again.',c1_hearth_cold:'Live embers, but no fuel.',c1_hearth_wait:'The wood is ready. I need to fan the embers.',c1_hearth_done:'The hearth is burning. Even its smoke says “you have a home.”',c1_pot_water:'The pot is full. It needs fire and a fragrant herb.',c1_pot_empty:'The copper pot is dry.',c1_pot_wait:'Water is ready, but soup still needs fire and mint.',c1_garden_dry:'The soil is cracked. A bucket of water will revive the mint.',c1_garden_water:'The soil drank. The mint lifted its head!',c1_nane:'Fresh wild mint for the pot.',c1_soup:'Warm mint fragrance filled the yard.',c1_soup_done:'The soup is simmering.',c1_ekmek:'Mother’s village bread.',c1_peynir:'Tulum cheese; good road food with bread.',c1_azik:'Bread and cheese together. Now I should wrap them.',c1_bez:'Mother embroidered a small tulip on this cloth.',c1_cikini:'The travel bundle is ready.',
  c1_wrong_rope:'The rope reaches but cannot grip. It needs a hook.',c1_wrong_hook:'The hook cannot reach alone.',c1_wrong_water:'The water belongs in the pot or on the mint bed.',c1_wrong_wood:'The hearth needs this wood.',c1_wrong_fan:'The fan belongs at the embers.',c1_wrong_mint:'Water goes to mint roots, not mint into water.',c1_wrong_food:'These do not make road food.',c1_need_water:'Mint would burn in a dry pot.',c1_need_fire:'Cold water does not make soup.',c1_before_leave:'I will not leave without saying farewell.',c1_gate_closed:'The gate is barred until my preparations are done.',
  c1_farewell_1:'Take it, son. Our provisions are few, but our prayers are many. May your road be open.',c1_farewell_2:'Mother, I will miss you very much.',c1_farewell_3:'My prayer is always with you. Go now, and may God keep you safe.',c1_farewell_4:'I promise, mother. Your blessing will guide me home.',c1_dua:'Mother’s blessing settled around me like invisible armour.',c1_gate_open:'The old wooden door opened onto the Whispering Forest road.',c1_transition:'Keloglan placed the warmth of his mother’s hearth not in his satchel, but in his heart.',
  c1_hint_rope:['Rope alone cannot retrieve the bucket.','Take the rope by the house and combine it with the iron hook in the yard.'],c1_hint_bucket:['Your hooked rope is ready.','Use it on the well, then use the recovered bucket on the well again.'],c1_hint_water:['The pot and garden both need water.','Bring one bucket to the copper pot and another to the mint bed.'],c1_hint_fire:['The hearth needs fuel.','Put dry wood in the hearth, then use the woven fan from the wall.'],c1_hint_soup:['Soup needs water, fire, and mint.','Pick mint from the watered bed and add it to the filled pot over the lit hearth.'],c1_hint_food:['Two foods on the table belong together.','Combine bread and cheese, then wrap the food in the hanging cloth.'],c1_hint_ana:['Everything is ready. Go to Mother.','Speak with Mother, then leave through the eastern gate.'],c1_hint_gate:['The journey begins at the gate.','Tap the open gate to the east.'],

const AU={ctx:null,master:null,muted:false,amb:null,ambProfile:null,ambNext:0,nb:null,mNext:0,mStep:0};

function audioOn(){
  if(!AU.ctx){try{const C=window.AudioContext||window.webkitAudioContext;AU.ctx=new C();AU.master=AU.ctx.createGain();AU.master.gain.value=AU.muted?0:1;AU.master.connect(AU.ctx.destination);}catch(e){return null;}}

function setMuted(m){AU.muted=m;try{localStorage.setItem('kule_mute',m?'1':'0');}catch(e){}if(AU.master)AU.master.gain.value=m?0:1;}
function noiseBuf(){if(!AU.nb){const c=AU.ctx,b=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.nb=b;}return AU.nb;}
function tone(f,d,type,f2,vol,delay){const c=AU.ctx;if(!c)return;try{const o=c.createOscillator(),g=c.createGain(),t0=c.currentTime+(delay||0);
  o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol||.05,t0+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g);g.connect(AU.master);o.start(t0);o.stop(t0+d+.05);}catch(e){}}
function noise(d,f,q,vol,delay,type){const c=AU.ctx;if(!c)return;try{const s=c.createBufferSource();s.buffer=noiseBuf();const bf=c.createBiquadFilter();bf.type=type||'bandpass';bf.frequency.value=f;bf.Q.value=q||1;
  const g=c.createGain(),t0=c.currentTime+(delay||0);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+Math.min(.05,d*.3));g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  s.connect(bf);bf.connect(g);g.connect(AU.master);s.start(t0,Math.random());s.stop(t0+d+.05);}catch(e){}}
function startAmbience(){const c=AU.ctx;if(!c||AU.amb)return;try{const s=c.createBufferSource();s.buffer=noiseBuf();s.loop=true;
  const rainBP=c.createBiquadFilter();rainBP.type='bandpass';rainBP.frequency.value=1800;rainBP.Q.value=.45;const rain=c.createGain();rain.gain.value=.0001;
  const windLP=c.createBiquadFilter();windLP.type='lowpass';windLP.frequency.value=520;const wind=c.createGain();wind.gain.value=.0001;
  s.connect(rainBP);rainBP.connect(rain);rain.connect(AU.master);s.connect(windLP);windLP.connect(wind);wind.connect(AU.master);s.start();AU.amb={source:s,rain,wind};}catch(e){}}
function ambienceForChapter(n){return n===6?'tower_rain':n===5?'cloud_moon':n===2?'forest_night':n===3?'canyon_wind':n===4?'lake_mist':'village_day';}
function applyAmbience(profile,immediate){
  const P={village_day:{visual:'clear',rain:0,wind:.008},forest_night:{visual:'mist',rain:0,wind:.022},canyon_wind:{visual:'clear',rain:0,wind:.028},lake_mist:{visual:'mist',rain:0,wind:.018},cloud_moon:{visual:'clear',rain:0,wind:.026},tower_rain:{visual:'rain',rain:.04,wind:.032}}[profile]||{visual:'clear',rain:0,wind:.008};
  AU.ambProfile=profile;WEATHER.profile=profile;WEATHER.visual=P.visual;WEATHER.rain=P.rain;WEATHER.wind=P.wind;if(!AU.ctx||!AU.amb)return;
  const t=AU.ctx.currentTime,d=immediate?0:.9;for(const [g,v] of [[AU.amb.rain,P.rain],[AU.amb.wind,P.wind]]){g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(Math.max(.0001,g.gain.value),t);g.gain.linearRampToValueAtTime(Math.max(.0001,v),t+d);}
}
function sceneAudioTick(){
  const profile=ambienceForChapter(typeof G==='undefined'?1:G.chapter);if(profile!==AU.ambProfile)applyAmbience(profile,false);const c=AU.ctx;if(!c||c.state!=='running'||AU.muted)return;
  if(c.currentTime<AU.ambNext)return;if(profile==='village_day'){SFX.chirp();AU.ambNext=c.currentTime+4+Math.random()*5;}
  else if(profile==='forest_night'){tone(980,.16,'sine',760,.012);tone(620,.22,'sine',520,.008,.12);AU.ambNext=c.currentTime+5+Math.random()*7;}
  else if(profile==='lake_mist'){tone(520,.18,'sine',440,.009);AU.ambNext=c.currentTime+5+Math.random()*6;}
  else if(profile==='cloud_moon'){tone(880,.3,'sine',1040,.011);tone(1320,.22,'triangle',1180,.008,.16);AU.ambNext=c.currentTime+4.5+Math.random()*5;}
  else AU.ambNext=c.currentTime+8;
}
function ambienceState(){return {profile:AU.ambProfile||WEATHER.profile,visual:WEATHER.visual,rain:WEATHER.rain,wind:WEATHER.wind,sourceCount:AU.amb?1:0};}
function villain(n){const c=AU.ctx;if(!c)return;for(let i=0;i<n;i++){try{const t0=c.currentTime+i*.09,o=c.createOscillator(),bp=c.createBiquadFilter(),g=c.createGain(),f=95*(1+(Math.random()-.5)*.3);
  o.type='sawtooth';o.frequency.setValueAtTime(f,t0);o.frequency.exponentialRampToValueAtTime(f*.85,t0+.09);bp.type='bandpass';bp.frequency.value=650+Math.random()*350;bp.Q.value=3;
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.09,t0+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+.1);o.connect(bp);bp.connect(g);g.connect(AU.master);o.start(t0);o.stop(t0+.12);}catch(e){}}}

let ctx=null;
const INK='#22150e';
const boilK=()=>Math.floor(tm*6);
function withCtx(c,fn){const o=ctx;ctx=c;try{fn();}finally{ctx=o;}}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);}
function ell(x,y,rx,ry,rot){ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,Math.PI*2);}
function fl(c){ctx.fillStyle=c;ctx.fill();}
function st(w,c){ctx.lineWidth=w;ctx.strokeStyle=c||INK;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();}
function ink(c,w){if(c)fl(c);st(w||2.2);}
/* Hafif "kaynayan" el çizgisi: kenarlar saniyede 6 kez çok az titrer */
function blob(cx,cy,rx,ry,seed,amp,n,still){amp=amp===undefined?.08:amp;n=n||14;const B=still?0:boilK(),p=[];

const HOME_VIG={};
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else{ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}}

function drawDawnSky(vw,forest){
  const canyon=G.chapter===3,lake=G.chapter===4,cloud=G.chapter===5;
  const g=ctx.createLinearGradient(0,0,0,H);
  if(lake){
    const cleared=F.mistCleared?1:0;
    g.addColorStop(0,cleared?'#18304c':'#102033');
    g.addColorStop(.52,cleared?'#3b6d82':'#284b5c');
    g.addColorStop(1,cleared?'#d8c396':'#7ea3a8');
  }else if(cloud){
    g.addColorStop(0,'#1c2748');g.addColorStop(.5,'#4e6896');g.addColorStop(1,'#f0d8b8');
  }else{
    g.addColorStop(0,canyon?'#2a3548':forest?'#16263b':'#334a68');
    g.addColorStop(.5,canyon?'#8e786c':forest?'#48655f':'#d28a68');
    g.addColorStop(1,canyon?'#edd3b0':forest?'#b17a58':'#f1c887');
  }
  ctx.fillStyle=g;ctx.fillRect(0,0,vw,H);
  const sx=vw*.78-G.cam*.025,sy=lake?104:canyon?108:forest?115:96;
  glow(sx,sy,lake?(F.mistCleared?145:95):120,lake?'235,245,255':'255,222,155',lake?(F.mistCleared?.42:.24):.32);
  circ(sx,sy,lake?28:30);fl(lake?'#f2f7ff':'#ffe0a0');
  for(let i=0;i<34;i++){const x=r2(3500,i)*vw,y=20+r2(3501,i)*180;ctx.globalAlpha=.16+.18*Math.sin(tm*.5+i);circ(x,y,.8+(i%3)*.5);fl('#fff7df');}ctx.globalAlpha=1;
  for(let i=0;i<5;i++){const x=((i*310+tm*(forest?2:5)-G.cam*.04)%(vw+500))-180,y=80+i%2*45;ctx.save();ctx.globalAlpha=lake?(F.mistCleared?.14:.26):.18;blob(x,y,115,18,3510+i,.08,12,true);fl(lake?'#d8ecef':forest?'#d7cfbd':'#fff0df');ctx.restore();}
}

  // Kazan ağız çemberi ve içindeki su / naneli çorba

/* --- AŞAMA 2: Bölüm 3 — Peri Bacalarının Sırrı (Kapadokya Vadisi, Doğal Tüf Peri Bacaları, Pınar Gözesi ve Kaya Mağarası) --- */
function drawFairyChimney(x,y,o){
  // o: {wBot, wTop, h, tilt, tone, cap:'single'|'twin'|'wide'|'cone'|'mushroom'|'stump', door, win, hollows, dovecote, seed, alpha}
  ctx.save();ctx.translate(x,y);
  if(o.alpha)ctx.globalAlpha=o.alpha;
  const wB=o.wBot||54,wT=o.wTop||24,h=o.h||190,tilt=o.tilt||0,sd=o.seed||3840;
  // Doğal zemin temas gölgesi ve etek taşları
  ctx.save();ctx.scale(1,.22);ell(0,10,wB+16,26);fl('rgba(32,20,14,.34)');ctx.restore();

  // Kapadokya volkanik tüf renk paletleri (açık bej, kum taşı, sıcak gri, gül-kil, toprak sarısı)
  const PAL={
    beige:['#f0e5d3','#cbb79b','#87735a','#4f4133'],
    sand: ['#ead5ae','#c4a476','#806444','#4a3825'],
    grey: ['#ded9d0','#ada69b','#6e675e','#3f3b36'],
    rose: ['#e3c4b2','#b88c76','#785342','#473025'],
    ochre:['#e6be8a','#be8c5c','#7a5134','#452c1c'],
    terra:['#dba98a','#ad7356','#6b412e','#3d2318']
  };
  const pal=PAL[o.tone]||PAL.beige;

  // Ana tüf kaya gövdesi (rüzgâr aşınmalı doğal silüet)
  ctx.beginPath();
  ctx.moveTo(-wB,4);
  ctx.bezierCurveTo(-wB*.92,-h*.34,tilt*.4-wT*1.22,-h*.72,tilt-wT,-h);
  ctx.lineTo(tilt+wT,-h);
  ctx.bezierCurveTo(tilt*.4+wT*1.22,-h*.72,wB*.92,-h*.34,wB,4);
  ctx.closePath();
  const cg=ctx.createLinearGradient(-wB,-h,wB,0);
  cg.addColorStop(0,pal[0]);cg.addColorStop(.52,pal[1]);cg.addColorStop(1,pal[2]);
  ctx.fillStyle=cg;ctx.fill();

  // Gövde içi yatay tortul katman çizgileri, aşınma kuşakları ve dikey çatlaklar
  ctx.save();ctx.clip();
  for(let ly=22;ly<h-12;ly+=24){
    const kx=tilt*(ly/h);
    ctx.beginPath();
    ctx.moveTo(-wB-4,4-ly);
    ctx.quadraticCurveTo(kx,-5-ly+Math.sin(ly*.12+sd)*4.5,wB+4,4-ly);
    st(ly%48===0?2.4:1.6,ly%48===0?'rgba(255,245,225,.28)':'rgba(62,42,30,.24)');
  }
  // Doğal dikey kaya çatlakları
  wl(tilt*.28-wT*.36,-h*.84,-wB*.26,-h*.20,sd+1,1.6,'rgba(54,38,28,.38)');
  wl(tilt*.52+wT*.24,-h*.68,wB*.30,-h*.14,sd+2,1.4,'rgba(54,38,28,.32)');
  ctx.restore();

  // Dış kontur
  ctx.beginPath();
  ctx.moveTo(-wB,4);
  ctx.bezierCurveTo(-wB*.92,-h*.34,tilt*.4-wT*1.22,-h*.72,tilt-wT,-h);
  ctx.lineTo(tilt+wT,-h);
  ctx.bezierCurveTo(tilt*.4+wT*1.22,-h*.72,wB*.92,-h*.34,wB,4);
  st(2.3,pal[3]);

  // Doğal kaya oyukları / rüzgâr nişleri (yapay kapı yerine doğal oyuklar)
  if(o.hollows){
    for(const [hx,hy,hw,hh] of o.hollows){
      ctx.save();ctx.translate(hx,hy);
      ell(0,0,hw,hh);fl('rgba(42,28,20,.65)');st(1.5,pal[2]);
      ell(0,1,hw*.68,hh*.68);fl('#221610');
      ctx.restore();
    }
  }

  // Oyulmuş güvercinlik nişleri (Kapadokya güvercinlik pencereleri)
  if(o.dovecote){
    for(const [nx,ny] of [[-14,-h*.72],[6,-h*.74],[-6,-h*.58],[14,-h*.60]]){
      ctx.fillStyle='#261913';rr(tilt*.6+nx-6,ny-8,12,14,5);ctx.fill();st(1.4,pal[2]);
    }
  }

  // Kaya oyma doğal pencere nişi
  if(o.win){
    const wx=tilt*.45+(o.winX||0),wy=-h*.56;
    ctx.fillStyle='#241812';rr(wx-10,wy-14,20,24,8);ctx.fill();st(1.8,pal[3]);
    wl(wx,wy-13,wx,wy+9,sd+3,1.4,'#5c4332');wl(wx-9,wy-2,wx+9,wy-2,sd+4,1.4,'#5c4332');
  }

  // Kaya Evi Girişi (yalnızca Kaya Dede'nin kaya evinde; Keloğlan'ın ~142px boyuyla tam orantılı yüksek kaya kemeri)
  if(o.door){
    const dw=64,dh=136; // Keloğlan sığacak tam boy kaya oyma kemer ve ahşap kapı
    // Dış taş kemer oyuğu ve derinlik gölgesi
    ctx.beginPath();
    ctx.moveTo(-dw/2-6,4);ctx.lineTo(-dw/2-6,-dh+28);
    ctx.quadraticCurveTo(0,-dh-14,dw/2+6,-dh+28);
    ctx.lineTo(dw/2+6,4);ctx.closePath();
    fl('#3b2c22');st(2.4,pal[3]);
    // Kemer taş dizisi (voussoirs)
    for(let a=-2;a<=2;a++){
      const ax=a*12,ay=-dh+12+Math.abs(a)*5;
      wl(ax,-dh+6+Math.abs(a)*4,ax*.85,ay+8,sd+20+a,1.6,'#6e5846');
    }
    // İç oyuk gölgesi ve yaşlanmış ahşap kapı kanatları (y=2 .. y=-124)
    ctx.beginPath();
    ctx.moveTo(-dw/2,3);ctx.lineTo(-dw/2,-dh+32);
    ctx.quadraticCurveTo(0,-dh-4,dw/2,-dh+32);
    ctx.lineTo(dw/2,3);ctx.closePath();
    fl('#261810');st(2,'#1c110b');
    ctx.beginPath();
    ctx.moveTo(-dw/2+5,2);ctx.lineTo(-dw/2+5,-dh+34);
    ctx.quadraticCurveTo(0,-dh+2,dw/2-5,-dh+34);
    ctx.lineTo(dw/2-5,2);ctx.closePath();
    fl('#6b442b');st(1.8,'#2e1a10');
    // Ahşap kapı tahtaları, demir kuşaklar ve halka tokmak
    for(const px of [-14,0,14])wl(px,-dh+18,px,2,sd+5+px,1.5,'#3d2415');
    ctx.fillStyle='#2f2824';ctx.fillRect(-dw/2+7,-84,dw-14,5);ctx.fillRect(-dw/2+7,-38,dw-14,5);
    circ(12,-60,4);st(1.8,'#d4a259');
    // Kapı önü doğal taş eşik basamağı
    ctx.fillStyle='#8c7862';rr(-dw/2-8,0,dw+16,8,3);ctx.fill();st(1.6,'#42362b');
  }

  // Koyu bazalt / andezit şapka kaya (mantar, çift başlıklı, geniş, konik veya aşınmış kütük)
  const capFill='#54453e',capDark='#382d28',capNeck='#735c4d';
  if(o.cap==='twin'){
    poly([[tilt-wT-8,-h+4],[tilt-wT-14,-h-26],[tilt-4,-h-26],[tilt-2,-h+4]],sd+6,.35);fl(capNeck);st(2,capDark);
    poly([[tilt+2,-h+4],[tilt+6,-h-22],[tilt+wT+14,-h-22],[tilt+wT+8,-h+4]],sd+7,.35);fl(capNeck);st(2,capDark);
    blob(tilt-wT*.55,-h-28,wT*.76,14,sd+8,.1,10,true);fl(capFill);st(2.2,capDark);
    blob(tilt+wT*.62,-h-24,wT*.70,13,sd+9,.1,10,true);fl('#5e4e46');st(2.2,capDark);
  }else if(o.cap==='wide'){
    blob(tilt,-h-7,wT*1.32,16,sd+8,.08,11,true);fl(capFill);st(2.3,capDark);
  }else if(o.cap==='cone'){
    poly([[tilt-wT*1.28,-h+4],[tilt,-h-40],[tilt+wT*1.28,-h+4]],sd+8,.3);fl(capFill);st(2.2,capDark);
  }else if(o.cap==='mushroom'){
    poly([[tilt-wT*.85,-h+4],[tilt-wT*.7,-h-14],[tilt+wT*.7,-h-14],[tilt+wT*.85,-h+4]],sd+6,.25);fl(capNeck);st(1.8,capDark);
    blob(tilt,-h-20,wT*1.38,15,sd+8,.09,11,true);fl(capFill);st(2.2,capDark);
  }else if(o.cap==='stump'){
    blob(tilt,-h-3,wT*.95,9,sd+8,.12,9,true);fl('#6b5a4e');st(2,capDark);
  }else{
    blob(tilt,-h-6,wT*1.18,14,sd+8,.1,11,true);fl(capFill);st(2.2,capDark);
  }
  ctx.restore();
}

function drawLakeSymbol(sym,x,y,r,col){
  ctx.save();ctx.translate(x,y);
  const c=col||'#ffe49e';
  if(sym===0){
    // 0: Hilal (Crescent)
    ctx.beginPath();ctx.arc(0,0,r,.65,Math.PI*2-.65);ctx.arc(r*.38,0,r*.75,Math.PI*2-.95,.95,true);ctx.closePath();ink(c,1.6);
  }else if(sym===1){
    // 1: Güneş (Sun)
    circ(0,0,r*.52);ink(c,1.6);
    for(let i=0;i<8;i++){const a=i*Math.PI/4;wl(Math.cos(a)*r*.68,Math.sin(a)*r*.68,Math.cos(a)*r*1.05,Math.sin(a)*r*1.05,3910+i,1.8,c);}
  }else if(sym===2){
    // 2: Yıldız (Star)
    star5(0,0,r*1.05,r*.45);ink(c,1.6);
  }else{
    // 3: Dalga (Wave)
    for(const dy of [-r*.32,r*.32]){
      ctx.beginPath();ctx.moveTo(-r,dy);ctx.quadraticCurveTo(-r*.5,dy-r*.45,0,dy);ctx.quadraticCurveTo(r*.5,dy+r*.45,r,dy);st(2.2,c);
    }
  }
  ctx.restore();
}

function summarizeTasks(ch,fl,inv){
  fl=fl||{};inv=inv||[];
  if(ch===1){
    let done=0;if(fl.bucketRecovered)done++;if(fl.hearthLit)done++;if(fl.soup)done++;if(inv.includes('cikini')||fl.farewell)done++;if(fl.eggGiven)done++;
    return done+'/5';
  }
  if(ch===2){
    let done=0;if(fl.foxFed)done++;if(fl.oakAwake)done++;if(fl.millRunning)done++;if(fl.stonesSolved)done++;if(fl.secretGateOpen)done++;
    return done+'/5';
  }
  if(ch===3){
    let done=0;if(fl.bazaltPicked)done++;if(fl.tufPicked)done++;if(fl.tangramSolved)done++;if(fl.mirrorMounted)done++;if(fl.mirrorSolved||fl.c3GateOpen)done++;
    return done+'/5';
  }
  if(ch===4){
    let done=0;if(fl.smallGearPicked&&fl.windingKeyPicked)done++;if(fl.lakeCrossed)done++;if(fl.bigGearPicked)done++;if(fl.gearsSolved)done++;if(fl.clockSolved||fl.c4GateOpen)done++;
    return done+'/5';
  }
  if(ch===5){
    let done=0;if(fl.windSolved)done++;if(fl.flowersSolved)done++;if(fl.sealSolved||fl.c5GateOpen)done++;
    return done+'/3';
  }
  if(ch===6){
    let done=0;if(fl.halka)done++;if(fl.kristal)done++;if(fl.talkedPeri)done++;if(fl.doorOpen)done++;if(fl.caught)done++;
    return done+'/5';
  }
  return '0/1';
}

  const ch=clamp(raw.chapter|0,1,7);
  const copy=Object.assign({},raw,{
    v:3,
    chapter:ch,
    savedAt:raw.savedAt||new Date().toISOString(),
    tasks:raw.tasks||summarizeTasks(ch,raw.F,raw.inv),
    F:Object.assign({},raw.F),
    inv:raw.inv.filter(i=>typeof i==='string')
  });
  if(ch===2&&(!Array.isArray(copy.F.stones)||copy.F.stones.length!==3))copy.F.stones=[2,3,0];
  if(ch===3&&(!Array.isArray(copy.F.mirrorAngles)||copy.F.mirrorAngles.length!==4))copy.F.mirrorAngles=[0,90,45,0];
  if(ch===4){
    if(!Array.isArray(copy.F.gearLocks)||copy.F.gearLocks.length!==3)copy.F.gearLocks=copy.F.gearsSolved?[true,true,true]:[false,false,false];
    if(typeof copy.F.clockHour!=='number')copy.F.clockHour=copy.F.clockSolved?4:12;
    if(typeof copy.F.clockMin!=='number')copy.F.clockMin=0;
  }
  if(ch===5){
    if(!Array.isArray(copy.F.windAngles)||copy.F.windAngles.length!==4)copy.F.windAngles=copy.F.windSolved?[3,0,1,0]:[0,1,2,3];
    if(!Array.isArray(copy.F.flowersWatered)||copy.F.flowersWatered.length!==3)copy.F.flowersWatered=[false,false,false];
    if(!Array.isArray(copy.F.flowerLightOrder))copy.F.flowerLightOrder=[];
    if(!Array.isArray(copy.F.flowerRunes))copy.F.flowerRunes=copy.F.flowersSolved?[1,2,0]:[];
    if(!Array.isArray(copy.F.sealWindState)||copy.F.sealWindState.length!==4)copy.F.sealWindState=copy.F.sealSolved?[3,0,1,0]:[0,0,0,0];

  }
  return copy;
}

function save(){
  if(G.mode!=='play'&&G.mode!=='rings'&&G.mode!=='tangram'&&G.mode!=='mirrors'&&G.mode!=='lake_stones'&&G.mode!=='clock_gears'&&G.mode!=='clock_face'&&G.mode!=='wind_path'&&G.mode!=='moon_flowers'&&G.mode!=='moon_seal'&&G.mode!=='pause')return;
  try{
    const p=makeSavePayload(0);
    localStorage.setItem(SAVE_KEY,JSON.stringify(p));
    G.dirty=false;
  }catch(e){}
}

function saveSlot(n){
  if(n<1||n>3)return null;
  try{
    const p=makeSavePayload(n);
    localStorage.setItem(SLOT_KEY(n),JSON.stringify(p));
    localStorage.setItem(SAVE_KEY,JSON.stringify(p));
    G.dirty=false;
    return p;
  }catch(e){return null;}
}

function readSlot(n){
  try{
    const key=n>=1&&n<=3?SLOT_KEY(n):SAVE_KEY;
    const raw=localStorage.getItem(key);
    if(!raw)return null;
    return normalizeSave(JSON.parse(raw));
  }catch(e){return null;}
}

function deleteSlot(n){
  try{if(n>=1&&n<=3)localStorage.removeItem(SLOT_KEY(n));else localStorage.removeItem(SAVE_KEY);}catch(e){}
}

function listSaveSlots(){
  return [1,2,3].map(n=>({slot:n,data:readSlot(n)}));
}

function readSave(){
  const auto=readSlot(0);
  if(auto)return auto;
  for(const n of [1,2,3]){const s=readSlot(n);if(s)return s;}
  return null;
}

function clearSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}

function exportSaveJSON(n){
  const d=n?readSlot(n):(G.mode==='play'||G.mode==='rings'||G.mode==='tangram'||G.mode==='mirrors'||G.mode==='lake_stones'||G.mode==='clock_gears'||G.mode==='clock_face'||G.mode==='wind_path'||G.mode==='moon_flowers'||G.mode==='moon_seal'||G.mode==='pause'?makeSavePayload(0):readSave());
  return d?JSON.stringify(d,null,2):null;
}

function importSaveJSON(str,targetSlot){
  try{
    const parsed=normalizeSave(JSON.parse(str));
    if(!parsed)return null;
    const slot=targetSlot>=1&&targetSlot<=3?targetSlot:1;
    parsed.slot=slot;
    localStorage.setItem(SLOT_KEY(slot),JSON.stringify(parsed));
    localStorage.setItem(SAVE_KEY,JSON.stringify(parsed));
    return parsed;
  }catch(e){return null;}
}

function loadGame(d){
  const valid=normalizeSave(d);
  if(!valid){
    newGame();
    if(typeof UI!=='undefined'&&UI.toast)UI.toast(T('m_corrupt_recovered'),3000);

  G.hints=valid.hints|0;

  if(G.chapter===6&&F.doorOpen&&!F.flyOut){const dh=valid.dh;setTimeout(()=>startDuel(dh),300);}

let lastTap={t:0,x:0};
function worldTap(x,y,item){
  if(G.busy||G.mode!=='play')return;
  const h=hsAt(x,y);G.tapFx={x,y:h?y:Math.max(y,GY-2),t:0,hot:!!h};
  if(G.form==='bird'){birdTap(x,y,h,item!=null?item:G.sel);return;}
  const dbl=(tm-lastTap.t<.32&&Math.abs(x-lastTap.x)<60);lastTap={t:tm,x};
  if(item==null)item=G.sel;
  if(h){G.sel=null;UI.inv();
    if(h.birdOnly){walkTo(clamp(h.ax,70,1760),dbl,()=>{hero.face=h.r[0]+h.r[2]/2>hero.x?1:-1;doAct('reachHigh',.6);say('kelo','farbird');});return;}
    walkTo(clamp(h.ax,70,1760),dbl,()=>{if(h.face)hero.face=h.face;else hero.face=(h.r[0]+h.r[2]/2)>hero.x?1:-1;
      if(item){if(!h.use||!h.use(item))nope(wrongLine(item,h.id));}else h.tap&&h.tap();});}
  else walkTo(clamp(x,70,1760),dbl,null); // seçili eşya yürürken elde kalır
}
function walkTo(x,run,cb){
  if(G.chapter===4&&!F.lakeCrossed&&x>508){
    hero.tx=495;hero.run=!!run||Math.abs(495-hero.x)>520;
    hero.pending=()=>{hero.face=1;say('kelo','c4_water_block');};
    if(Math.abs(hero.tx-hero.x)<4){const p=hero.pending;hero.pending=null;p&&p();}
    return;
  }
  if(G.chapter===5&&!F.windSolved&&x>548){
    hero.tx=530;hero.run=!!run||Math.abs(530-hero.x)>520;
    hero.pending=()=>{hero.face=1;say('kelo','c5_bridge_closed');};
    if(Math.abs(hero.tx-hero.x)<4){const p=hero.pending;hero.pending=null;p&&p();}
    return;
  }
  hero.tx=x;hero.run=!!run||Math.abs(x-hero.x)>520;hero.pending=cb;if(Math.abs(hero.tx-hero.x)<4){hero.pending=null;cb&&cb();}
}

function hintKey(){
  if(G.chapter!==6)return chapterHintKey();

  if(F.keyIn)return 'hx_rings';
  if(has('anahtar'))return 'hx_door';
  if(G.form==='bird')return (!F.tuy||!F.talkedPeri)?'hx_bird':'hx_back';

let SCRIPT=null;
function runScript(steps,done){
  if(SCRIPT&&SCRIPT.active){SCRIPT.steps.push(...steps);if(done){const d0=SCRIPT.done;SCRIPT.done=()=>{d0&&d0();done();};}return;}
  SCRIPT={steps:steps.slice(),done,active:true,wait:0,walking:false};G.busy=true;nextStep();}
function nextStep(){
  const S=SCRIPT;if(!S)return;
  if(!S.steps.length){S.active=false;SCRIPT=null;G.busy=false;G.focus=G.stage==='duel'?G.focus:null;hero.talk=0;UI.hideDlg();S.done&&S.done();return;}
  const st=S.steps.shift();
  if(st[0]==='say'){const o=st[3]||{};G.focus=o.cam!==undefined?o.cam:(G.stage==='duel'?G.focus:null);
    const text=o.text?st[2]:T(st[2]);
    UI.showDlg(st[1],text,null,nextStep);}
  else if(st[0]==='do'){st[1]();nextStep();}
  else if(st[0]==='wait'){UI.hideDlg();S.wait=st[1];}
  else if(st[0]==='walk'){UI.hideDlg();S.walking=true;walkTo(st[1],false,()=>{S.walking=false;nextStep();});}
  else if(st[0]==='cinematic'){UI.hideDlg();startAnaFarewellCinematic(st[1],nextStep);}
  else if(st[0]==='choose'){UI.showDlg('kelo','',st[1].map(([k,fn])=>[T(k),()=>{S.steps.unshift(...fn());nextStep();}]),null);}
}

function anaStatusKey(){
  if(!F.bucketRecovered)return 'c1_ana_status_start';
  if(!F.potWater||!F.gardenWatered)return 'c1_ana_status_water';
  if(!F.hearthLit)return 'c1_ana_status_fire';
  if(!F.soup)return 'c1_ana_status_soup';
  if(!has('cikini'))return 'c1_ana_status_food';
  return 'c1_ana_status_done';
}

function talkAna(){
  if(F.farewell){say('ana','c1_gate_open');return;}

  runScript([['say','ana',status],['choose',[
    ['c1_ana_ask',()=>[['say','ana',status]]],

}

function classifyAnswer(raw){const n=normTr(raw);if(!n)return {kind:'unk'};const joined=n.replace(/ /g,'');
  const words=n.split(' ');const pick=st=>words.find(w=>w.startsWith(st))||(joined.startsWith(st)?joined:null);

  for(const st of BIG_STEMS){const w=words.find(x=>x===st||x.startsWith(st)&&x.length<=st.length+4);if(w)return {kind:'big',word:raw.trim()};}

function ensureTangramState(){
  const c={x:VIEW.w/2,y:252};
  if(!Array.isArray(F.tangramState)||F.tangramState.length!==5){
    F.tangramState=TANGRAM_DEF.map(d=>({id:d.id,ox:d.startX,oy:d.startY,ang:d.startAng,locked:false}));
  }
  return {c,pieces:TANGRAM_DEF.map((d,i)=>{
    const st=F.tangramState[i]||{id:d.id,ox:d.startX,oy:d.startY,ang:d.startAng,locked:false};
    return {def:d,st,x:c.x+(st.locked?d.dx:st.ox),y:c.y+(st.locked?d.dy:st.oy),tx:c.x+d.dx,ty:c.y+d.dy};
  })};
}
UI.openTangram=function(){

  G.mode='tangram';G.sel=null;UI.inv();save();
};
UI.rotateTangramPiece=function(idx){
  const {pieces}=ensureTangramState();
  const i=idx!==undefined?idx:(A.tgSel||0);
  const p=pieces[i];if(!p||p.st.locked)return;
  p.st.ang=(p.st.ang+45)%360;SFX.click();
  if(Math.hypot((p.st.ox-p.def.dx),(p.st.oy-p.def.dy))<36&&p.st.ang%360===p.def.targetAng){
    p.st.ox=p.def.dx;p.st.oy=p.def.dy;p.st.locked=true;SFX.lock();
    if(F.tangramState.every(s=>s.locked)){setTimeout(()=>tangramSolved(),450);}
  }
  save();
};
UI.solveTangramNow=function(){
  ensureTangramState();
  F.tangramState.forEach((s,i)=>{s.ox=TANGRAM_DEF[i].dx;s.oy=TANGRAM_DEF[i].dy;s.ang=TANGRAM_DEF[i].targetAng;s.locked=true;});
  tangramSolved();
};
UI.tangramDown=function(sx,sy){
  const {c,pieces}=ensureTangramState();
  if(Math.hypot(sx-(c.x+270),sy-(c.y-182))<32){G.mode='play';SFX.pop();save();return;}
  if(Math.abs(sx-(c.x+168))<78&&Math.abs(sy-(c.y+158))<24){UI.rotateTangramPiece(A.tgSel||0);return;}
  for(let i=pieces.length-1;i>=0;i--){
    const p=pieces[i];if(p.st.locked)continue;
    if(Math.hypot(sx-p.x,sy-p.y)<48){
      A.tgSel=i;
      A.tgDrag={idx:i,startX:sx,startY:sy,origOx:p.st.ox,origOy:p.st.oy,moved:false};
      SFX.pop();return;
    }
  }
};
UI.tangramMove=function(sx,sy){
  if(!A.tgDrag)return;
  const {c,pieces}=ensureTangramState();
  const d=A.tgDrag,p=pieces[d.idx];if(!p||p.st.locked)return;
  if(Math.hypot(sx-d.startX,sy-d.startY)>6)d.moved=true;
  if(d.moved){
    p.st.ox=clamp(d.origOx+(sx-d.startX),-290,290);
    p.st.oy=clamp(d.origOy+(sy-d.startY),-165,165);
  }
};
UI.tangramUp=function(sx,sy){
  if(!A.tgDrag)return;
  const {pieces}=ensureTangramState();
  const d=A.tgDrag,p=pieces[d.idx];A.tgDrag=null;
  if(!p||p.st.locked)return;
  if(!d.moved){
    UI.rotateTangramPiece(d.idx);
    return;
  }
  const dist=Math.hypot(p.st.ox-p.def.dx,p.st.oy-p.def.dy);
  const angOk=(p.st.ang%360)===p.def.targetAng;
  if(dist<36&&angOk){
    p.st.ox=p.def.dx;p.st.oy=p.def.dy;p.st.locked=true;
    SFX.lock();
    if(F.tangramState.every(s=>s.locked)){save();setTimeout(()=>tangramSolved(),450);return;}
  }else if(dist<58&&!angOk){
    SFX.nope();UI.toast(T('c3_tangram_wrong'),2000);
  }
  save();
};
UI.drawTangram=function(){
  const {c,pieces}=ensureTangramState();
  ctx.fillStyle='rgba(10,7,14,.82)';ctx.fillRect(0,0,VIEW.w,H);
  ctx.save();ctx.translate(c.x,c.y);
  // Taş sunak tablası
  rr(-310,-195,620,390,22);ctx.fillStyle='#2a1c17';ctx.fill();st(3,'#cfa068');
  rr(-298,-183,596,366,16);ctx.fillStyle='#1f1410';ctx.fill();
  // Sol: Hedef peri bacası silüeti
  ctx.fillStyle='rgba(255,215,150,.05)';rr(-200,-152,230,275,14);ctx.fill();
  for(const p of pieces){
    ctx.save();ctx.translate(p.def.dx,p.def.dy);
    ctx.beginPath();p.def.pts.forEach(([px,py],i)=>i?ctx.lineTo(px,py):ctx.moveTo(px,py));ctx.closePath();

};

/* ---------- Bölüm 3 · Bulmaca 2: Kaya Mağarası Işık ve Ayna Düzeneği ---------- */
const MIRROR_NODES=[
  {ox:-190,oy:-70,target:90},
  {ox:-190,oy:75,target:45},
  {ox:35,oy:75,target:135},
  {ox:35,oy:-70,target:135}
];
const MIRROR_PILLARS=[
  {ox:-80,oy:-70,r:25},
  {ox:130,oy:75,r:25}
];
const MIRROR_SEAL={ox:215,oy:-70,r:26};
function ensureMirrorState(){
  if(!Array.isArray(F.mirrorAngles)||F.mirrorAngles.length!==4)F.mirrorAngles=[0,90,45,0];
  return {c:{x:VIEW.w/2,y:252},angles:F.mirrorAngles};
}
function traceCaveBeam(){
  const {angles}=ensureMirrorState();
  const pts=[{x:-190,y:-155}];
  let x=-190,y=-155,dx=0,dy=1,hitSeal=false,hitPillar=false;
  for(let step=0;step<6;step++){
    let bestT=520,hitType=null,hitIdx=-1;
    // Check mirrors
    MIRROR_NODES.forEach((m,i)=>{
      const rx=m.ox-x,ry=m.oy-y;
      const proj=rx*dx+ry*dy;
      const perp=Math.hypot(rx-proj*dx,ry-proj*dy);
      if(proj>12&&proj<bestT&&perp<12){bestT=proj;hitType='mirror';hitIdx=i;}
    });
    // Check pillars
    MIRROR_PILLARS.forEach((p,i)=>{
      const rx=p.ox-x,ry=p.oy-y;
      const proj=rx*dx+ry*dy;
      const perp=Math.hypot(rx-proj*dx,ry-proj*dy);
      if(proj>10&&proj<bestT&&perp<p.r){bestT=proj;hitType='pillar';hitIdx=i;}
    });
    // Check seal
    {
      const rx=MIRROR_SEAL.ox-x,ry=MIRROR_SEAL.oy-y;
      const proj=rx*dx+ry*dy;
      const perp=Math.hypot(rx-proj*dx,ry-proj*dy);
      if(proj>10&&proj<bestT&&perp<MIRROR_SEAL.r){bestT=proj;hitType='seal';}
    }
    // Clamp to box [-285..285, -165..165]
    if(dx>0)bestT=Math.min(bestT,(285-x)/dx);
    if(dx<0)bestT=Math.min(bestT,(-285-x)/dx);
    if(dy>0)bestT=Math.min(bestT,(165-y)/dy);
    if(dy<0)bestT=Math.min(bestT,(-165-y)/dy);
    x+=dx*bestT;y+=dy*bestT;
    pts.push({x,y});
    if(hitType==='seal'){hitSeal=true;break;}
    if(hitType==='pillar'){hitPillar=true;break;}
    if(hitType==='mirror'){
      const a=(angles[hitIdx]%180)*Math.PI/180;
      const tx=Math.cos(a),ty=Math.sin(a);
      const nx=-ty,ny=tx;
      const dot=dx*nx+dy*ny;
      // Işın ayna yüzeyine paralelse aynada durmaz; aynı yönde bir sonraki kaideye ilerler.
      if(Math.abs(dot)<0.15)continue;
      dx=dx-2*dot*nx;dy=dy-2*dot*ny;
      const len=Math.hypot(dx,dy)||1;dx/=len;dy/=len;
    }else break;
  }
  return {pts,hitSeal,hitPillar};
}
UI.openMirrors=function(){
  ensureMirrorState();
  G.mode='mirrors';G.sel=null;UI.inv();save();
};
UI.solveMirrorsNow=function(){
  ensureMirrorState();
  F.mirrorAngles=[90,45,135,135];
  mirrorsSolved();
};
UI.mirrorsTap=function(sx,sy){
  const {c,angles}=ensureMirrorState();
  if(Math.hypot(sx-(c.x+270),sy-(c.y-182))<36){G.mode='play';SFX.pop();save();return;}
  for(let i=0;i<MIRROR_NODES.length;i++){
    const m=MIRROR_NODES[i];
    if(Math.hypot(sx-(c.x+m.ox),sy-(c.y+m.oy))<46){
      angles[i]=(angles[i]+45)%180;
      const aligned=(angles[i]===m.target);
      if(aligned)SFX.lock();else SFX.click();
      const tr=traceCaveBeam();
      save();
      if(tr.hitSeal&&!A.mirrorsDone){
        A.mirrorsDone=true;
        SFX.chime();
        setTimeout(()=>{A.mirrorsDone=false;mirrorsSolved();},650);
      }
      return;
    }
  }
};
UI.drawMirrors=function(){
  const {c,angles}=ensureMirrorState();
  const tr=traceCaveBeam();
  ctx.fillStyle='rgba(8,6,14,.84)';ctx.fillRect(0,0,VIEW.w,H);
  ctx.save();ctx.translate(c.x,c.y);
  rr(-310,-195,620,390,22);ctx.fillStyle='#241920';ctx.fill();st(3,'#d4a66a');
  rr(-296,-181,592,362,16);ctx.fillStyle='#161018';ctx.fill();
  // Tavan yarık ışığı kaynağı
  ell(-190,-162,28,10);fl('#ffe89a');
  // Bazalt engel sütunları
  for(const p of MIRROR_PILLARS){
    circ(p.ox,p.oy,p.r);ink('#3d2e36',2.5);
    circ(p.ox-5,p.oy-5,p.r*.55);fl('rgba(255,255,255,.06)');
  }
  // Kristal mühür (hedef)
  ctx.save();ctx.translate(MIRROR_SEAL.ox,MIRROR_SEAL.oy);
  if(tr.hitSeal){ctx.globalCompositeOperation='lighter';glow(0,0,58,'120,245,230',.65);ctx.globalCompositeOperation='source-over';}
  poly([[0,-26],[22,0],[0,26],[-22,0]],3920,.2);ink(tr.hitSeal?'#7ef7e8':'#396e72',2.5);
  ctx.restore();
  // Işık huzmesi
  ctx.save();
  ctx.strokeStyle='rgba(255,230,130,.28)';ctx.lineWidth=11;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();tr.pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();
  ctx.strokeStyle='#fff6b8';ctx.lineWidth=3.5;
  ctx.beginPath();tr.pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();
  ctx.restore();
  // 4 Ayna kaidesi
  MIRROR_NODES.forEach((m,i)=>{
    const aligned=(i===0?(angles[i]===90||angles[i]===45):angles[i]===m.target);
    ctx.save();ctx.translate(m.ox,m.oy);
    if(aligned){ctx.globalCompositeOperation='lighter';glow(0,0,38,'255,225,130',.32);ctx.globalCompositeOperation='source-over';}
    circ(0,0,28);ink(aligned?'#3a2c18':'#2e2018',2.2);
    if(aligned){circ(0,0,31);st(1.8,'rgba(255,220,120,.65)');}
    ctx.rotate(angles[i]*Math.PI/180);
    rr(-24,-5,48,10,4);ink('#d49b4b',2);
    rr(-20,-2,40,4,2);fl('#9eefff');
    ctx.restore();
    ctx.fillStyle=aligned?'#ffe89a':'#e5cfa8';ctx.font='700 11.5px Nunito, sans-serif';ctx.textAlign='center';
    ctx.fillText((i+1)+'. Ayna ('+angles[i]+'°)',m.ox,m.oy+42);
  });
  // Kapat (X) düğmesi
  ctx.save();ctx.translate(270,-182);circ(0,0,20);ink('#f2e6c9',2.4);wl(-7,-7,7,7,3930,3);wl(7,-7,-7,7,3931,3);ctx.restore();
  ctx.restore();
  ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillStyle='#f2e6c9';ctx.font='700 34px "Amatic SC", cursive';
  ctx.fillText(T('c3_mirrors_t'),c.x,H-28);
  ctx.font='700 13px Nunito, system-ui, sans-serif';ctx.fillStyle='#cdb991';
  ctx.fillText(T('c3_mirrors_s'),c.x,H-10);
};

const LAKE_STONE_COLS=[
  {ox:-185,syms:[1,0,2],safeRow:1,targetSym:0}, // Adım 1: Hilal (0)
  {ox:-62, syms:[1,3,0],safeRow:0,targetSym:1}, // Adım 2: Güneş (1)
  {ox:62,  syms:[3,1,2],safeRow:2,targetSym:2}, // Adım 3: Yıldız (2)
  {ox:185, syms:[0,3,2],safeRow:1,targetSym:3}  // Adım 4: Dalga (3)
];
const LAKE_STONE_ROWS=[-76,6,88];
function ensureLakeStonesState(){
  if(typeof F.stoneStep!=='number'||F.stoneStep<0||F.stoneStep>4)F.stoneStep=0;
  return {c:{x:VIEW.w/2,y:252},step:F.stoneStep,cols:LAKE_STONE_COLS,rows:LAKE_STONE_ROWS};
}
UI.openLakeStones=function(){
  ensureLakeStonesState();

};
UI.solveLakeStonesNow=function(){
  ensureLakeStonesState();

UI.lakeStonesTap=function(sx,sy){
  const {c,cols,rows}=ensureLakeStonesState();
  if(Math.hypot(sx-(c.x+270),sy-(c.y-182))<36){G.mode='play';SFX.pop();save();return;}
  const curCol=F.stoneStep|0;
  if(curCol>=4)return;
  for(let colIdx=0;colIdx<cols.length;colIdx++){
    const col=cols[colIdx];
    for(let rowIdx=0;rowIdx<rows.length;rowIdx++){
      const tx=c.x+col.ox,ty=c.y+rows[rowIdx];
      if(Math.hypot(sx-tx,sy-ty)<44){
        if(colIdx!==curCol){
          // Sadece sıradaki adımdaki taşlara basılabilir
          SFX.click();return;
        }
        const sym=col.syms[rowIdx];
        if(sym===col.targetSym){
          F.stoneStep=curCol+1;
          SFX.lock();
          save();
          if(F.stoneStep>=4){
            setTimeout(()=>lakeStonesSolved(),420);
          }else{
            UI.toast(T('c4_stones_step_ok'),1400);
          }
        }else{
          // Yanlış taş: suya gömülür, oyuncu kilitlenmeden baştan (1. sıradan) dener
          SFX.splash();
          A.stoneSplash={col:colIdx,row:rowIdx,t:tm};
          F.stoneStep=0;
          save();
          UI.toast(T('c4_stones_wrong'),2800);
        }
        return;
      }
    }
  }
};
UI.drawLakeStones=function(){
  const {c,step,cols,rows}=ensureLakeStonesState();
  ctx.fillStyle='rgba(8,14,22,.84)';ctx.fillRect(0,0,VIEW.w,H);
  ctx.save();ctx.translate(c.x,c.y);
  rr(-310,-195,620,390,22);ctx.fillStyle='#1b323d';ctx.fill();st(3,'#78a8b5');
  rr(-296,-181,592,362,16);
  const wg=ctx.createLinearGradient(-296,-180,296,180);
  wg.addColorStop(0,'#132833');wg.addColorStop(.5,'#1d3f4f');wg.addColorStop(1,'#10232d');
  ctx.fillStyle=wg;ctx.fill();

  // Sol İskele ve Sağ Ada kıyıları
  rr(-292,-135,44,270,8);ink('#5c3d24',2);
  rr(248,-135,44,270,8);ink('#54635d',2);

  // Üst bilgi şeridi: Güneş Saati Sıra İpucu (1. Hilal -> 2. Güneş -> 3. Yıldız -> 4. Dalga)
  rr(-210,-168,420,36,10);fl('rgba(16,30,38,.85)');st(1.6,'#58828f');
  for(let s=0;s<4;s++){
    const bx=-135+s*90,by=-150,done=s<step;
    circ(bx,by,13);ink(done?'#2e5c4a':'#223842',1.6);
    drawLakeSymbol(s,bx,by,6.5,done?'#9ef7c8':(F.sundialRead?'#ffe596':'#7b9ca6'));
    if(s<3)wl(bx+20,by,bx+70,by,4020+s,1.8,'#4c6e7a');
  }

  // 4 Sütun x 3 Sıra Taşlar
  cols.forEach((col,colIdx)=>{
    const isCurrent=(colIdx===step),isPast=(colIdx<step);
    rows.forEach((ry,rowIdx)=>{
      const sym=col.syms[rowIdx],isSafe=(rowIdx===col.safeRow);
      const passed=isPast&&isSafe;
      const splashed=A.stoneSplash&&A.stoneSplash.col===colIdx&&A.stoneSplash.row===rowIdx&&(tm-A.stoneSplash.t)<.7;
      ctx.save();ctx.translate(col.ox,ry);
      if(isCurrent){
        ctx.globalCompositeOperation='lighter';glow(0,0,42,'160,235,250',.22+.08*Math.sin(tm*3.5));ctx.globalCompositeOperation='source-over';
      }
      if(passed){
        ctx.globalCompositeOperation='lighter';glow(0,0,44,'150,255,190',.38);ctx.globalCompositeOperation='source-over';
      }
      ell(0,0,42,30);
      ink(passed?'#3b6e5c':splashed?'#243d47':isCurrent?'#4b6b75':'#32474f',passed?2.8:isCurrent?2.4:1.8);
      ell(0,-2,34,23);fl(passed?'#4e8772':isCurrent?'#5b7d87':'#3d555e');
      drawLakeSymbol(sym,0,-2,11,passed?'#b8ffd8':isCurrent?'#ffe89e':'#9ab4bc');
      ctx.restore();
    });
    ctx.fillStyle=isCurrent?'#ffe89a':'#9ec0cc';ctx.font='800 12px Nunito, sans-serif';ctx.textAlign='center';
    ctx.fillText((colIdx+1)+'. Adım',col.ox,142);
  });

  // Kapat (X) düğmesi
  ctx.save();ctx.translate(270,-182);circ(0,0,20);ink('#f2e6c9',2.4);wl(-7,-7,7,7,4030,3);wl(7,-7,-7,7,4031,3);ctx.restore();
  ctx.restore();
  ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillStyle='#f2e6c9';ctx.font='700 34px "Amatic SC", cursive';
  ctx.fillText(T('c4_stones_t'),c.x,H-28);
  ctx.font='700 13px Nunito, system-ui, sans-serif';ctx.fillStyle='#cdb991';
  ctx.fillText(T('c4_stones_s'),c.x,H-10);
};

const CLOCK_GEAR_NODES=[
  {id:'small',ox:-155,oy:-42,r:42,teeth:8,col:'#d49248',label:'1. Küçük Çark'},
  {id:'mid',  ox:-18, oy:8,  r:52,teeth:10,col:'#b87c3b',label:'2. Orta Çark'},
  {id:'large',ox:128, oy:48, r:64,teeth:12,col:'#9e7b36',label:'3. Büyük Dişli'}
];
const WIND_LEVER_BOX={ox:205,oy:-78,w:124,h:54};
function ensureClockGearsState(){
  if(!Array.isArray(F.gearLocks)||F.gearLocks.length!==3)F.gearLocks=[false,false,false];
  return {c:{x:VIEW.w/2,y:252},locks:F.gearLocks,nodes:CLOCK_GEAR_NODES,lever:WIND_LEVER_BOX};
}
UI.openClockGears=function(){
  ensureClockGearsState();
  G.mode='clock_gears';G.sel=null;UI.inv();save();
};
UI.solveClockGearsNow=function(){
  ensureClockGearsState();
  clockGearsSolved();
};
UI.clockGearsTap=function(sx,sy){
  const {c,locks,nodes,lever}=ensureClockGearsState();
  if(Math.hypot(sx-(c.x+270),sy-(c.y-182))<36){G.mode='play';SFX.pop();save();return;}
  // Kurma Kolu (Winding Lever) kontrolü
  if(Math.abs(sx-(c.x+lever.ox))<lever.w/2+10&&Math.abs(sy-(c.y+lever.oy))<lever.h/2+10){
    if(locks[0]&&locks[1]&&locks[2]){
      SFX.clank();SFX.chime();
      clockGearsSolved();
    }else{
      SFX.nope();
      UI.toast(T('c4_gears_need_all'),2400);
    }
    return;
  }
  // Çark yuvaları kontrolü (Sıra: 0 -> 1 -> 2)
  for(let i=0;i<nodes.length;i++){
    const g=nodes[i];
    if(Math.hypot(sx-(c.x+g.ox),sy-(c.y+g.oy))<g.r+14){
      if(i===0){
        locks[0]=true;SFX.lock();save();return;
      }
      if(i===1){
        if(!locks[0]){SFX.nope();F.gearLocks=[false,false,false];save();UI.toast(T('c4_gears_order_wrong'),2500);return;}
        locks[1]=true;SFX.lock();save();return;
      }
      if(i===2){
        if(!locks[0]||!locks[1]){SFX.nope();F.gearLocks=[false,false,false];save();UI.toast(T('c4_gears_order_wrong'),2500);return;}
        locks[2]=true;SFX.lock();save();return;
      }
    }
  }
};
UI.drawClockGears=function(){
  const {c,locks,nodes,lever}=ensureClockGearsState();
  const allLocked=locks[0]&&locks[1]&&locks[2];
  ctx.fillStyle='rgba(10,8,6,.84)';ctx.fillRect(0,0,VIEW.w,H);
  ctx.save();ctx.translate(c.x,c.y);
  rr(-310,-195,620,390,22);ctx.fillStyle='#2a211b';ctx.fill();st(3,'#d4a66a');
  rr(-296,-181,592,362,16);ctx.fillStyle='#1c1512';ctx.fill();

  // Mil bağlantı hatları
  wl(nodes[0].ox,nodes[0].oy,nodes[1].ox,nodes[1].oy,4040,6,'#423328');
  wl(nodes[1].ox,nodes[1].oy,nodes[2].ox,nodes[2].oy,4041,6,'#423328');

  // 3 Çark
  nodes.forEach((g,i)=>{
    const locked=!!locks[i];
    const spin=allLocked?(tm*(i===1?-1.8:1.4)):(locked?.25:0);
    ctx.save();ctx.translate(g.ox,g.oy);
    if(locked){ctx.globalCompositeOperation='lighter';glow(0,0,g.r+24,'255,220,125',.34);ctx.globalCompositeOperation='source-over';}
    ctx.save();ctx.rotate(spin);
    for(let t=0;t<g.teeth;t++){
      const a=t*Math.PI*2/g.teeth;
      ctx.save();ctx.rotate(a);
      ctx.fillStyle=locked?g.col:'#5c4d42';
      ctx.fillRect(-5,-g.r-8,10,12);st(1.5,'#261c16');
      ctx.restore();
    }
    circ(0,0,g.r);ink(locked?g.col:'#4d4036',2.5);
    circ(0,0,g.r*.35);ink(locked?'#ffd87a':'#261c16',2);
    ctx.restore();
    ctx.fillStyle=locked?'#ffe89a':'#d6c3a5';ctx.font='800 13px Nunito, sans-serif';ctx.textAlign='center';
    ctx.fillText(g.label,0,g.r+28);
    ctx.restore();
  });

  // Sağ Üst: Kurma Kolu Düğmesi
  ctx.save();ctx.translate(lever.ox,lever.oy);
  if(allLocked){ctx.globalCompositeOperation='lighter';glow(0,0,56,'255,225,130',.45+.15*Math.sin(tm*4));ctx.globalCompositeOperation='source-over';}
  rr(-lever.w/2,-lever.h/2,lever.w,lever.h,14);
  ink(allLocked?'#c98838':'#4a3e35',2.4);
  ctx.fillStyle='#fff4dc';ctx.font='800 14px Nunito, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('Kurma Kolu',0,0);
  ctx.restore();

  // Kapat (X) düğmesi
  ctx.save();ctx.translate(270,-182);circ(0,0,20);ink('#f2e6c9',2.4);wl(-7,-7,7,7,4050,3);wl(7,-7,-7,7,4051,3);ctx.restore();
  ctx.restore();
  ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillStyle='#f2e6c9';ctx.font='700 34px "Amatic SC", cursive';
  ctx.fillText(T('c4_gears_t'),c.x,H-28);
  ctx.font='700 13px Nunito, system-ui, sans-serif';ctx.fillStyle='#cdb991';
  ctx.fillText(T('c4_gears_s'),c.x,H-10);
};

  if(Math.hypot(sx-(c.x+270),sy-(c.y-182))<36){G.mode='play';SFX.pop();save();return;}
  // Akrep (+1 Saat) düğmesi
  if(Math.abs(sx-(c.x+hourBtn.ox))<hourBtn.w/2+8&&Math.abs(sy-(c.y+hourBtn.oy))<hourBtn.h/2+8){
    F.clockHour=(F.clockHour%12)+1;SFX.click();save();return;
  }
  // Yelkovan (+15 Dk) düğmesi
  if(Math.abs(sx-(c.x+minBtn.ox))<minBtn.w/2+8&&Math.abs(sy-(c.y+minBtn.oy))<minBtn.h/2+8){
    F.clockMin=(F.clockMin+15)%60;SFX.click();save();return;
  }
  // Çanı Çal ve Doğrula düğmesi
  if(Math.abs(sx-(c.x+ringBtn.ox))<ringBtn.w/2+8&&Math.abs(sy-(c.y+ringBtn.oy))<ringBtn.h/2+8){
    if((F.clockHour%12)===4&&(F.clockMin%60)===0){
      clockFaceSolved();
    }else{
      SFX.nope();
      UI.toast(T('c4_clock_wrong'),2800);
    }
    return;
  }
  // Kadran üzerindeki saat rakamlarına (1..12) doğrudan dokunarak Akrep'i o saate getirme
  const dx=sx-(c.x+dial.ox),dy=sy-(c.y+dial.oy),dist=Math.hypot(dx,dy);
  if(dist>35&&dist<dial.r+18){
    let ang=Math.atan2(dy,dx)+Math.PI/2;
    if(ang<0)ang+=Math.PI*2;
    let h=Math.round(ang/(Math.PI/6))%12;
    if(h===0)h=12;
    F.clockHour=h;SFX.click();save();
  }
};
UI.drawClockFace=function(){
  const {c,dial,hourBtn,minBtn,ringBtn}=ensureClockFaceState();
  const isTarget=((F.clockHour%12)===4&&(F.clockMin%60)===0);
  ctx.fillStyle='rgba(8,12,18,.84)';ctx.fillRect(0,0,VIEW.w,H);
  ctx.save();ctx.translate(c.x,c.y);
  rr(-310,-195,620,390,22);ctx.fillStyle='#242c33';ctx.fill();st(3,'#d4a66a');
  rr(-296,-181,592,362,16);ctx.fillStyle='#161c22';ctx.fill();

  // Sol: Büyük Saat Kulesi Kadranı
  ctx.save();ctx.translate(dial.ox,dial.oy);
  if(isTarget){ctx.globalCompositeOperation='lighter';glow(0,0,dial.r+32,'255,225,130',.38);ctx.globalCompositeOperation='source-over';}
  circ(0,0,dial.r+10);ink('#5c4732',3);
  circ(0,0,dial.r);ink('#f5ebd4',2.4);
  for(let h=1;h<=12;h++){
    const a=h*Math.PI/6-Math.PI/2;
    const tx=Math.cos(a)*(dial.r-26),ty=Math.sin(a)*(dial.r-26);
    wl(Math.cos(a)*(dial.r-10),Math.sin(a)*(dial.r-10),Math.cos(a)*(dial.r-3),Math.sin(a)*(dial.r-3),4060+h,h%3===0?3:1.6,'#3b2a1a');
    ctx.fillStyle=(h===4&&F.sundialRead)?'#b85a1e':'#2b1e14';
    ctx.font='800 18px Nunito, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(String(h),tx,ty);
  }
  const hAng=((F.clockHour%12)+(F.clockMin/60))*Math.PI/6-Math.PI/2;
  const mAng=(F.clockMin/60)*Math.PI*2-Math.PI/2;
  // Yelkovan (uzun kırmızı-bakır ibre)
  wl(0,0,Math.cos(mAng)*(dial.r-34),Math.sin(mAng)*(dial.r-34),4075,4,'#9e3320');
  // Akrep (kısa kalın koyu bronz ibre)
  wl(0,0,Math.cos(hAng)*(dial.r-58),Math.sin(hAng)*(dial.r-58),4076,6.5,'#24170f');
  circ(0,0,8);ink('#d99b3e',2);
  ctx.restore();

  // Sağ: Dijital Vakit Göstergesi ve Kontrol Düğmeleri
  const hh=String(F.clockHour).padStart(2,'0'),mm=String(F.clockMin).padStart(2,'0');
  ctx.fillStyle='#ffe89a';ctx.font='800 22px Nunito, sans-serif';ctx.textAlign='center';
  ctx.fillText('Vakit: '+hh+':'+mm,165,-128);

  for(const [btn,lab,col] of [
    [hourBtn,T('c4_clock_hour_btn'),'#4a5d6e'],
    [minBtn, T('c4_clock_min_btn'), '#4a5d6e'],
    [ringBtn,T('c4_clock_ring_btn'),isTarget?'#c98838':'#7a542e']
  ]){
    ctx.save();ctx.translate(btn.ox,btn.oy);
    rr(-btn.w/2,-btn.h/2,btn.w,btn.h,12);ink(col,2.2);
    ctx.fillStyle='#fff5e0';ctx.font='800 14px Nunito, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(lab,0,0);
    ctx.restore();
  }

  // Kapat (X) düğmesi
  ctx.save();ctx.translate(270,-182);circ(0,0,20);ink('#f2e6c9',2.4);wl(-7,-7,7,7,4080,3);wl(7,-7,-7,7,4081,3);ctx.restore();
  ctx.restore();
  ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillStyle='#f2e6c9';ctx.font='700 34px "Amatic SC", cursive';
  ctx.fillText(T('c4_clock_t'),c.x,H-28);
  ctx.font='700 13px Nunito, system-ui, sans-serif';ctx.fillStyle='#cdb991';
  ctx.fillText(T('c4_clock_s'),c.x,H-10);
};

function drawC5PuzzleFooter(c,titleKey,subKey){const maxW=VIEW.w-20,title=T(titleKey),sub=T(subKey);let ts=34;ctx.textAlign='center';ctx.fillStyle='#f2e6c9';ctx.font='700 '+ts+'px "Amatic SC", cursive';while(ts>23&&ctx.measureText(title).width>maxW){ts--;ctx.font='700 '+ts+'px "Amatic SC", cursive';}ctx.fillText(title,c.x,H-28);
  ctx.font='700 12px Nunito, sans-serif';ctx.fillStyle='#c9d8e8';if(ctx.measureText(sub).width<=maxW){ctx.fillText(sub,c.x,H-10);return;}
  const words=sub.split(' '),lines=[''];for(const word of words){const next=(lines[lines.length-1]+' '+word).trim();if(ctx.measureText(next).width>maxW&&lines[lines.length-1]){lines.push(word);}else lines[lines.length-1]=next;}if(lines.length>2){ctx.font='700 10px Nunito, sans-serif';const joined=lines.join(' ');lines.length=0;lines.push(joined.slice(0,Math.ceil(joined.length/2)).trim(),joined.slice(Math.ceil(joined.length/2)).trim());}ctx.fillText(lines[0],c.x,H-17);if(lines[1])ctx.fillText(lines[1],c.x,H-5);
}
const C5_WIND_TARGET=[3,0,1,0]; // Yukarı, Sağ, Aşağı, Sağ

  else if(ch===4){g.addColorStop(0,'#263e56');g.addColorStop(.65,'#7893a0');g.addColorStop(1,'#34434c');}
  else if(ch===5){g.addColorStop(0,'#334d82');g.addColorStop(.62,'#b6c9e4');g.addColorStop(1,'#e8dcae');}
  else{g.addColorStop(0,'#1c1430');g.addColorStop(.65,'#392654');g.addColorStop(1,'#22182e');}
  x.fillStyle=g;x.fillRect(0,0,w,h);
  // Zemin
  x.fillStyle=ch===1?'#6e5034':ch===2?'#2c422c':ch===3?'#7a3f28':ch===4?'#41545d':ch===5?'#cbd6e4':'#282032';
  x.fillRect(0,h-22,w,22);
  // Bölüm silüeti
  if(ch===1){
    x.fillStyle='#d8c3a5';x.fillRect(22,h-52,44,30);
    x.fillStyle='#8f4326';x.beginPath();x.moveTo(18,h-52);x.lineTo(44,h-70);x.lineTo(70,h-52);x.fill();
    x.fillStyle='#ff9a3c';x.beginPath();x.arc(44,h-32,6,0,Math.PI*2);x.fill();
  }else if(ch===2){
    x.fillStyle='#3d291a';x.fillRect(74,h-64,20,42);
    x.fillStyle='#2f6b47';x.beginPath();x.arc(84,h-66,24,0,Math.PI*2);x.fill();
    x.strokeStyle='#c99846';x.lineWidth=2;x.beginPath();x.arc(132,h-38,12,0,Math.PI*2);x.stroke();
  }else if(ch===3){
    for(const px of [38,82,126]){
      x.fillStyle='#b86b48';x.beginPath();x.moveTo(px-12,h-22);x.lineTo(px-5,h-62);x.lineTo(px+5,h-62);x.lineTo(px+12,h-22);x.fill();
      x.fillStyle='#6e3924';x.beginPath();x.ellipse(px,h-64,9,5,0,0,Math.PI*2);x.fill();
    }
  }else if(ch===5){
    x.fillStyle='#eef3f8';for(const px of [22,55,88]){x.beginPath();x.ellipse(px,h-25,28,9,0,0,Math.PI*2);x.fill();}
    x.fillStyle='#d4deed';x.fillRect(108,h-74,34,52);x.beginPath();x.arc(125,h-74,24,Math.PI,0);x.fill();
    x.fillStyle='#f1d77b';x.beginPath();x.arc(125,h-82,7,.6,Math.PI*2-.6);x.fill();
  }else{
    x.fillStyle='#2a2038';x.fillRect(108,h-76,28,54);
    x.fillStyle='#ffe28a';x.fillRect(118,h-64,6,8);
  }
  // Keloğlan minyatür izi
  const kx=clamp(Math.round((data.x||350)/1800*(w-36))+18,18,w-18);
  x.fillStyle='#f3cfa6';x.beginPath();x.arc(kx,h-34,5,0,Math.PI*2);x.fill();
  x.fillStyle='#b85236';x.fillRect(kx-4,h-29,8,9);
};

function fmtSaveDate(iso){
  if(!iso)return '';
  try{
    const d=new Date(iso);
    if(isNaN(d.getTime()))return '';
    return d.toLocaleString(LANG==='en'?'en-US':'tr-TR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  }catch(_){return '';}
}

const cv=$('cv'),mctx=cv.getContext('2d');
const VIEW={w:960,s:1,S:1,dpr:1,portrait:false};
function resize(){
  const wrap=$('stageWrap'),Wv=wrap.clientWidth,Hv=wrap.clientHeight;if(!Wv||!Hv)return;
  let w=Wv-12,h=Hv-12,s=h/H,vw=w/s;
  if(vw>1320){vw=1320;w=vw*s;}
  if(vw<560){vw=560;s=w/vw;h=H*s;}
  VIEW.portrait=Wv<Hv;VIEW.w=vw;VIEW.s=s;VIEW.dpr=VIEW.lowDpr?1:Math.min(window.devicePixelRatio||1,matchMedia('(pointer:coarse)').matches?1.5:2);VIEW.S=s*VIEW.dpr;
  cv.style.width=w+'px';cv.style.height=h+'px';cv.width=Math.round(w*VIEW.dpr);cv.height=Math.round(h*VIEW.dpr);
  cv.style.marginTop=VIEW.portrait?'-40px':'0';$('turn').hidden=!VIEW.portrait;
}
window.addEventListener('resize',resize);if(window.ResizeObserver)new ResizeObserver(resize).observe($('stageWrap'));
function toScreenLocal(cx,cy){const r=cv.getBoundingClientRect();return {x:(cx-r.left)/r.width*VIEW.w,y:(cy-r.top)/r.height*H};}
function toWorld(cx,cy){const p=toScreenLocal(cx,cy);return {x:p.x+G.cam,y:p.y};}

/* ---------- Girdi: dokun = git/etkileş; yatay sürükle = etrafa bak ---------- */
let pdown=null,pointer=null,panHold=0;
cv.addEventListener('pointerdown',e=>{e.preventDefault();audioOn();
  const p=toScreenLocal(e.clientX,e.clientY);
  if(G.mode==='tangram'){UI.tangramDown(p.x,p.y);try{cv.setPointerCapture(e.pointerId);}catch(_){}return;}
  pdown={x:e.clientX,y:e.clientY,cam:G.cam,moved:false};try{cv.setPointerCapture(e.pointerId);}catch(_){}});
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')pointer=toScreenLocal(e.clientX,e.clientY);
  if(G.mode==='tangram'&&A.tgDrag){const p=toScreenLocal(e.clientX,e.clientY);UI.tangramMove(p.x,p.y);return;}
  if(pdown&&G.mode==='play'){const dx=e.clientX-pdown.x;if(Math.abs(dx)>14)pdown.moved=true;
    if(pdown.moved){G.cam=clamp(pdown.cam-dx/VIEW.s,0,WW-VIEW.w);panHold=2.5;}}});
cv.addEventListener('pointerup',e=>{
  const p=toScreenLocal(e.clientX,e.clientY);

  const at=(x,y,h,item)=>{ctx.save();ctx.translate(x-h.x,y-(GY-3));drawKelo(h,item);ctx.restore();};

  tm=0.5;ex.forEach((e,i)=>{ctx.save();ctx.beginPath();ctx.rect(110+i*195-90,52,180,196);ctx.clip();ctx.translate(110+i*195,150);ctx.scale(2.2,2.2);ctx.translate(-3,-(GY-3+KELO_HEAD_Y));drawKelo(base({mood:e}),null,true);ctx.restore();label(exN[i],110+i*195,268);});
  tm=0.5;
  // 2. satır: yürüyüş döngüsü 8 kare
  label('Yürüyüş döngüsü (8 kare)',Wd/2,300,'800 16px');
  for(let i=0;i<8;i++)at(120+i*190,500,base({moving:true,phase:i*Math.PI/4}));
  // 3. satır: koşu
  label('Koşu (8 kare)',Wd/2,540,'800 16px');
  for(let i=0;i<8;i++)at(120+i*190,740,base({moving:true,run:true,phase:i*Math.PI/4}));

  const acts=[['reachLow','yerden alma'],['reach','uzanma'],['reachHigh','yükseğe uzanma'],['hot','eli yandı'],['think','düşünme'],['shrug','omuz silkme'],['cheer','sevinç'],['surprise','şaşırma']];
  acts.forEach(([a,n],i)=>{tm=1.3;at(120+i*190,1000,base({act:{type:a,t:a==='cheer'?.22:.45,dur:a==='cheer'?.9:.9}}),null);label(n,120+i*190,1040);});
  label('Ali Cengiz — ifadeler ve büyü',Wd/2,1100,'800 16px');
  const ac=[['smirk','sırıtma',0],['laugh','kahkaha',0],['angry','öfke',0],['surprised','şaşkınlık',0],['angry','büyü yapma',1]];
  ac.forEach(([e,n,c],i)=>{tm=2.1;drawAC(160+i*235,1440,1,{expr:e,laugh:e==='laugh',cast:c});label(n,160+i*235,1480);});
  ctx.save();ctx.translate(1440,1330);label('Nurperi',0,150);drawPeri(0,0,3.2,{});ctx.restore();
